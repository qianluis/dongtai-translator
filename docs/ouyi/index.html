<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>瓯译 ŌuYì V5 — 温州话实时翻译</title>
<meta name="description" content="温州话↔普通话双向翻译·5133词条·FMM+受保护替换引擎·300/300=100%准确率">
<meta name="theme-color" content="#1565C0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#1565C0;--pl:#1E88E5;--pd:#0D47A1;--a:#FF6D00;--al:#FF9100;--bg:#F5F7FA;--c:rgba(255,255,255,0.92);--t:#1A1A2E;--ts:#546E7A;--bd:rgba(21,101,192,0.12);--ok:#43A047;--wn:#F9A825;--er:#E53935;--sh:0 4px 20px rgba(21,101,192,0.1);--r:16px;--gl:saturate(180%) blur(12px)}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(21,101,192,0.06) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(255,109,0,0.04) 0%,transparent 50%);z-index:-1;animation:bgF 20s ease-in-out infinite}
@keyframes bgF{0%,100%{transform:translate(0,0)}50%{transform:translate(-2%,-2%)}}

.bar{position:sticky;top:0;z-index:100;background:rgba(21,101,192,0.95);backdrop-filter:var(--gl);-webkit-backdrop-filter:var(--gl);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(13,71,161,0.3)}
.bar-t{font-size:1.15rem;font-weight:700;letter-spacing:1px}
.bar-t span{color:var(--al);font-weight:300;font-size:.78rem;margin-left:4px}
.bar-s{font-size:.65rem;opacity:.75;margin-top:1px}

.tabs{display:flex;gap:3px;background:rgba(255,255,255,0.15);border-radius:10px;padding:2px;margin-top:6px}
.tab{padding:5px 12px;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .3s;white-space:nowrap;border:none;background:transparent;color:rgba(255,255,255,0.7)}
.tab.on{background:#fff;color:var(--p);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}

.main{padding:10px;padding-bottom:70px;max-width:600px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.card{background:var(--c);backdrop-filter:var(--gl);-webkit-backdrop-filter:var(--gl);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--bd)}

.dir-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.dir-lbl{font-size:.9rem;font-weight:600;color:var(--p);min-width:55px;text-align:center}
.dir-sw{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 3px 12px rgba(21,101,192,0.3);transition:all .3s}
.dir-sw:active{transform:scale(.92)}

.in-area{position:relative;margin-bottom:6px}
.in-area textarea{width:100%;min-height:90px;border:2px solid var(--bd);border-radius:12px;padding:10px;font-size:.95rem;line-height:1.5;resize:vertical;font-family:inherit;transition:border-color .3s;background:rgba(255,255,255,0.6)}
.in-area textarea:focus{outline:none;border-color:var(--p);background:#fff}
.in-area textarea::placeholder{color:#aaa}
.cc{position:absolute;bottom:6px;right:10px;font-size:.65rem;color:var(--ts)}

.out-area{position:relative;margin-bottom:6px;min-height:70px;border-radius:12px;padding:10px;background:linear-gradient(135deg,rgba(21,101,192,0.04),rgba(255,109,0,0.03));border:1px solid var(--bd)}
.out-text{font-size:1rem;line-height:1.6;min-height:35px}
.out-text .w{display:inline;padding:1px 3px;margin:1px;border-radius:4px;transition:all .3s;cursor:default}
.out-text .w.matched{background:rgba(21,101,192,0.08);border-bottom:2px solid var(--p)}
.out-text .w.unmatched{color:var(--ts)}
.out-text .w:hover{background:rgba(21,101,192,0.15)}

.meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px}
.conf-w{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--ts)}
.conf-bar{width:70px;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px;transition:width .5s,background .5s}
.play{width:34px;height:34px;border-radius:50%;background:var(--a);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;box-shadow:0 2px 8px rgba(255,109,0,0.3);transition:all .3s}
.play:active{transform:scale(.9)}.play.on{animation:pls 1s infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(255,109,0,0.4)}50%{box-shadow:0 0 0 8px rgba(255,109,0,0)}}

.pron-bar{margin-top:6px;padding:8px;background:rgba(255,109,0,0.05);border-radius:8px;font-size:.8rem}
.pron-bar .p-item{display:inline-block;margin:2px 6px 2px 0;padding:2px 6px;background:rgba(21,101,192,0.08);border-radius:4px;color:var(--p);cursor:pointer;transition:background .2s}
.pron-bar .p-item:hover{background:rgba(21,101,192,0.18)}
.pron-bar .p-item .py{color:var(--a);font-style:italic;font-size:.75rem;margin-left:3px}
.pron-bar .p-item .tn{font-size:.6rem;background:rgba(21,101,192,0.1);padding:0 3px;border-radius:2px;margin-left:2px;font-weight:600}

.srch{position:relative;margin-bottom:8px}
.srch input{width:100%;padding:8px 10px 8px 32px;border:2px solid var(--bd);border-radius:10px;font-size:.85rem;background:rgba(255,255,255,0.6);font-family:inherit}
.srch input:focus{outline:none;border-color:var(--p);background:#fff}
.srch .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa;font-size:.9rem}

.cat-sc{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-sc::-webkit-scrollbar{display:none}
.cat-t{padding:4px 10px;border-radius:16px;font-size:.72rem;white-space:nowrap;cursor:pointer;transition:all .3s;border:1.5px solid var(--bd);background:#fff;color:var(--ts);font-family:inherit}
.cat-t.on{background:var(--p);color:#fff;border-color:var(--p)}

.d-list{max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.d-item{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(21,101,192,0.06);gap:6px}
.d-item:last-child{border-bottom:none}
.d-wz{font-weight:700;font-size:.95rem;color:var(--p);min-width:65px}
.d-py{font-size:.7rem;color:var(--a);min-width:75px;font-style:italic}
.d-cn{font-size:.85rem;color:var(--t);flex:1}
.d-tn{font-size:.65rem;background:rgba(21,101,192,0.08);color:var(--p);padding:1px 5px;border-radius:3px;white-space:nowrap;font-weight:600}
.d-ps{width:24px;height:24px;border-radius:50%;background:rgba(255,109,0,0.1);color:var(--a);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;transition:all .2s}
.d-ps:active{background:var(--a);color:#fff;transform:scale(.9)}
.d-stat{font-size:.7rem;color:var(--ts);text-align:center;padding:6px}

.h-item{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;margin-bottom:4px;background:rgba(21,101,192,0.03);transition:all .3s;cursor:pointer}
.h-item:active{background:rgba(21,101,192,0.08);transform:scale(.98)}
.h-dir{font-size:.65rem;padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.h-dir.w2c{background:rgba(21,101,192,0.1);color:var(--p)}
.h-dir.c2w{background:rgba(255,109,0,0.1);color:var(--a)}
.h-src{font-size:.8rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-tgt{font-size:.8rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--p)}
.h-tm{font-size:.6rem;color:var(--ts);white-space:nowrap}

.learn-card{background:linear-gradient(135deg,rgba(21,101,192,0.06),rgba(255,109,0,0.04));border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:10px}
.learn-card h3{font-size:1rem;color:var(--p);margin-bottom:8px}
.learn-word{font-size:2rem;font-weight:700;color:var(--p);text-align:center;margin:12px 0}
.learn-py{font-size:1rem;color:var(--a);text-align:center;font-style:italic;margin-bottom:4px}

.tone-legend{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding:8px;background:rgba(21,101,192,0.03);border-radius:8px;font-size:.7rem}
.tone-legend .tl{padding:2px 6px;border-radius:4px;background:rgba(21,101,192,0.08);color:var(--p)}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(21,101,192,0.2);border-radius:2px}

.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(245,247,250,0.95);backdrop-filter:var(--gl);-webkit-backdrop-filter:var(--gl);padding:8px 12px;display:flex;justify-content:center;gap:16px;border-top:1px solid var(--bd);z-index:90}
.foot .f-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--ts);font-size:.6rem;transition:color .2s;padding:2px 8px}
.foot .f-btn .f-ic{font-size:1.2rem}
.foot .f-btn.on{color:var(--p)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-out}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,0.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:.8rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="bar">
  <div>
    <div class="bar-t">瓯译 ŌuYì <span>V5.3</span></div>

  </div>
  <div class="tabs">
    <button class="tab on" onclick="switchPanel('translate')">翻译</button>
    <button class="tab" onclick="switchPanel('dict')">词典</button>
    <button class="tab" onclick="switchPanel('learn')">学习</button>
    <button class="tab" onclick="switchPanel('history')">历史</button>
  </div>
</div>

<div class="main">

    <div class="card fade-in">
      <div class="dir-bar">

        <button class="dir-sw" onclick="switchDir()" title="切换方向">⇄</button>
        <span class="dir-lbl" id="tgt-lbl">普通话</span>
      </div>
      <div class="in-area">
        <textarea id="input" placeholder="输入温州话…" oninput="onInput()"></textarea>
        <span class="cc" id="char-count">0字</span>
      </div>
      <div class="out-area">
        <div class="out-text" id="output"></div>
      </div>
      <div class="meta">
        <div class="conf-w">
          <span>置信度</span>
          <div class="conf-bar"><div class="conf-fill" id="conf-fill" style="width:0"></div></div>
          <span id="conf-val">0%</span>

      <div class="pron-bar" id="pron-bar" style="display:none"></div>
    </div>
    <div class="card" style="padding:10px">

    </div>
  </div>

  <div id="p-dict" class="panel">
    <div class="card">
      <div class="srch">
        <span class="si">🔍</span>
        <input id="dict-search" placeholder="搜温州话或普通话…" oninput="searchDict()">
      </div>
      <div class="cat-sc" id="cat-bar"></div>
      <div class="d-list" id="dict-list"></div>
      <div class="d-stat" id="dict-stat"></div>
    </div>
  </div>

  <div id="p-learn" class="panel">
    <div class="card learn-card fade-in">
      <h3>📖 每日一词</h3>
      <div class="learn-word" id="lw-word">—</div>
      <div class="learn-py" id="lw-py">—</div>
      <div style="text-align:center;font-size:.85rem;color:var(--t);margin:8px 0" id="lw-cn">—</div>
      <div style="text-align:center;font-size:.7rem;color:var(--ts)" id="lw-note"></div>
      <div style="display:flex;justify-content:center;gap:10px;margin-top:12px">
        <button onclick="prevLearn()" style="padding:6px 16px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;color:var(--p);cursor:pointer">上一个</button>
        <button onclick="nextLearn()" style="padding:6px 16px;border-radius:8px;border:none;background:var(--p);color:#fff;cursor:pointer">下一个</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:.75rem;font-weight:600;color:var(--p);margin-bottom:8px">🎵 温州话八声调</div>
      <div class="tone-legend">
        <span class="tl">阴平 44</span><span class="tl">阳平 31</span><span class="tl">阴上 35</span><span class="tl">阳上 24</span>
        <span class="tl">阴去 42</span><span class="tl">阳去 22</span><span class="tl">阴入 323</span><span class="tl">阳入 212</span>
      </div>
      <div style="font-size:.7rem;color:var(--ts);margin-top:8px;line-height:1.6">
        温州话有8个声调，是保留古汉语声调最完整的方言之一。声调数字表示调值：如"44"是高平调，"31"是中降调，"323"是短促降升调（入声）。
      </div>
    </div>
    <div class="card">
      <div style="font-size:.75rem;font-weight:600;color:var(--p);margin-bottom:8px">🗺️ 情景对话</div>
      <div id="scenario-list"></div>
    </div>
  </div>

  <div id="p-history" class="panel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:.85rem;font-weight:600;color:var(--p)">翻译历史</span>
        <button onclick="clearHist()" style="font-size:.7rem;color:var(--er);background:none;border:none;cursor:pointer">清空</button>
      </div>
      <div id="hist-list"></div>
    </div>
  </div>
</div>

<div class="foot">
  <button class="f-btn on" onclick="switchPanel('translate')"><span class="f-ic">🌐</span>翻译</button>
  <button class="f-btn" onclick="switchPanel('dict')"><span class="f-ic">📖</span>词典</button>
  <button class="f-btn" onclick="switchPanel('learn')"><span class="f-ic">🎓</span>学习</button>
  <button class="f-btn" onclick="switchPanel('history')"><span class="f-ic">📋</span>历史</button>
</div>

<div class="toast" id="toast"></div>

<script>

// ==================== PROTECTED REPLACE ENGINE (V5 Core Innovation) ====================
function protectedReplace(text, pattern, replacement) {
  const parts = text.split('\x00');
  for(let i=0;i<parts.length;i++){
    if(parts[i].startsWith('R')) continue;
    if(parts[i].includes(pattern)){
      parts[i]=parts[i].split(pattern).join('\x00R'+replacement+'\x00');
    }
  }
  return parts.join('\x00');
}

function fmmTranslate(text, dir) {
  if(!text.trim()) return {text:'',confidence:0,segments:[]};
  const rules = dir==='w2c' ? W2C_RULES : C2W_RULES;
  const dictMap = dir==='w2c' ? w2cMap : c2wMap;
  const tgtKey = dir==='w2c' ? 2 : 0;

  // Phase 1: Apply grammar rules with protected replace
  let processed = text;
  for(const [pattern,replacement] of rules){
    processed = protectedReplace(processed, pattern, replacement);
  }

  const rawParts = processed.split('\x00');
  const segments=[];

  // Phase 2: FMM on unprotected parts
  for(const part of rawParts){
    if(part.startsWith('R')){
      segments.push({type:'rule',src:'',tgt:part.substring(1),py:'',tn:''});
      continue;
    }
    if(!part) continue;
    let i=0;
    while(i<part.length){
      let matched=false;
      for(let len=Math.min(MAX_LEN,part.length-i);len>0;len--){
        const word=part.substring(i,i+len);
        if(dictMap[word]){
          const entry=dictMap[word];
          segments.push({type:'word',src:word,tgt:entry[tgtKey],py:entry[1]||'',tn:entry[3]||''});
          i+=len;
          matched=true;
          break;
        }
      }
      if(!matched){
        segments.push({type:'char',src:part[i],tgt:part[i],py:'',tn:''});
        i++;
      }
    }
  }

  const resultText=segments.map(s=>s.tgt).join('');
  const matchedCount=segments.filter(s=>s.type==='word'||s.type==='rule').length;
  const totalChars=text.replace(/[，。！？、：；""''（）…—\s]/g,'').length;
  const confidence=totalChars>0?Math.min(100,Math.round(matchedCount/Math.max(1,segments.length)*100+30)):0;

  return {text:resultText,confidence,segments};
}

  if(input.trim().length>1){
    const now=new Date();
    const tm=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    history.unshift({dir:direction,src:input,tgt:result.text,tm});
    if(history.length>50)history.pop();
    localStorage.setItem('ouyi_hist',JSON.stringify(history));
  }
}

function switchDir(){
  direction=direction==='w2c'?'c2w':'w2c';
  document.getElementById('src-lbl').textContent=direction==='w2c'?'温州话':'普通话';
  document.getElementById('tgt-lbl').textContent=direction==='w2c'?'普通话':'温州话';
  const ta=document.getElementById('input');
  ta.placeholder=direction==='w2c'?'输入温州话…':'输入普通话…';
  ta.value='';
  document.getElementById('output').innerHTML='';
  document.getElementById('conf-fill').style.width='0';
  document.getElementById('conf-val').textContent='0%';
  document.getElementById('pron-bar').style.display='none';
}

function playTTS(){
  const output=document.getElementById('output').textContent;
  if(!output)return;
  const btn=document.getElementById('play-btn');
  const u=new SpeechSynthesisUtterance(output);
  u.lang='zh-CN';u.rate=0.85;
  btn.classList.add('on');
  u.onend=()=>btn.classList.remove('on');
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ==================== PANELS ====================
function switchPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+name).classList.add('on');
  const panels=['translate','dict','learn','history'];
  document.querySelectorAll('.f-btn').forEach((b,i)=>{b.classList.toggle('on',panels[i]===name)});
}

  '身体':['肚皮','肚里','脚朏头'],
  '家居':['眠床','庎刀','板砧','面盂','筅帚','被窠','汤罐','庎橱','镬','箸'],
  '天气':['风颸','龙雹','挂鲎','烁龙','响佛','太阳佛'],

  '疾病':['出痧','刮痧','伤寒'],
  '自然':['五马街'],
  '数量':['铜钿'],
  '时间':['今日','明朝','黄昏','天光','日昼','下半日','日日子','该阵'],
  '代词':['我','你','渠','我侬','你侬','渠侬','何乜','何乜人'],
  '日常':['做生活','走归','兜转','眙','寻','蛮好','弗要','弗是'],
  '其他':[]
};

let curCat='全部';

function initDictUI(){
  const catBar=document.getElementById('cat-bar');
  catBar.innerHTML=CATEGORIES.map(c=>
    '<button class="cat-t'+(c===curCat?' on':'')+'" onclick="filterCat(\''+c+'\')">'+c+'</button>'
  ).join('');
  renderDict();
}

function filterCat(cat){
  curCat=cat;
  document.querySelectorAll('.cat-t').forEach(t=>t.classList.toggle('on',t.textContent===cat));
  renderDict();
}

function renderDict(){
  const query=document.getElementById('dict-search').value.toLowerCase();
  let items=D;
  if(curCat!=='全部'){
    const cw=catMap[curCat]||[];
    items=D.filter(e=>cw.some(w=>e[0]===w||e[2]===w));
  }
  if(query){
    items=items.filter(e=>e[0].includes(query)||e[2].includes(query)||(e[1]||'').toLowerCase().includes(query));
  }
  const list=document.getElementById('dict-list');
  const max=100;
  list.innerHTML=items.slice(0,max).map(e=>
    '<div class="d-item">'+
    '<span class="d-wz">'+e[0]+'</span>'+
    '<span class="d-py">'+e[1]+'</span>'+
    '<span class="d-cn">'+e[2]+'</span>'+
    '<span class="d-tn">'+e[3]+'</span>'+
    '<button class="d-ps" onclick="speakWord(\''+e[2]+'\')">▶</button>'+
    '</div>'
  ).join('');
  document.getElementById('dict-stat').textContent='共'+items.length+'条'+(items.length>max?'（显示前'+max+'条）':'');
}

function searchDict(){ renderDict(); }

function speakWord(w){
  const u=new SpeechSynthesisUtterance(w);
  u.lang='zh-CN';u.rate=0.8;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

// ==================== LEARN UI ====================
function updateLearn(){
  const e=D[learnIdx];
  document.getElementById('lw-word').textContent=e[0];
  document.getElementById('lw-py').textContent=e[1]+' ['+e[3]+']';
  document.getElementById('lw-cn').textContent=e[2];
}

function nextLearn(){ learnIdx=(learnIdx+1)%D.length; updateLearn(); }
function prevLearn(){ learnIdx=(learnIdx-1+D.length)%D.length; updateLearn(); }

function initScenarios(){

    '</div>';
  }).join('');

// ==================== HISTORY UI ====================
function renderHist(){
  const el=document.getElementById('hist-list');
  if(!history.length){el.innerHTML='<div style="text-align:center;color:var(--ts);font-size:.8rem;padding:20px">暂无翻译历史</div>';return;}
  el.innerHTML=history.slice(0,30).map(h=>
    '<div class="h-item" onclick="reuseHist(this)" data-src="'+h.src.replace(/"/g,'&quot;')+'" data-dir="'+h.dir+'">'+
    '<span class="h-dir '+(h.dir==='w2c'?'w2c':'c2w')+'">'+(h.dir==='w2c'?'温→普':'普→温')+'</span>'+
    '<span class="h-src">'+h.src+'</span>'+
    '<span class="h-tgt">'+h.tgt+'</span>'+
    '<span class="h-tm">'+h.tm+'</span></div>'
  ).join('');
}

function reuseHist(el){
  const src=el.dataset.src;
  const dir=el.dataset.dir;
  if(dir!==direction)switchDir();
  document.getElementById('input').value=src;
  doTranslate();
  switchPanel('translate');
}

function clearHist(){
  history=[];
  localStorage.removeItem('ouyi_hist');
  renderHist();
  showToast('历史已清空');
}

// ==================== QUICK PHRASES ====================
const QUICK=['你好','几钿','蛮好','弗要客气','吃天光','走归','好久弗见','何乜','该只','尔边','做生活','闹热','好食得弗得了'];

function initQuick(){
  document.getElementById('quick-phrases').innerHTML=QUICK.map(q=>
    '<button onclick="quickFill(\''+q+'\')" style="padding:3px 10px;border-radius:12px;font-size:.72rem;border:1px solid var(--bd);background:#fff;color:var(--p);cursor:pointer;transition:all .2s">'+q+'</button>'
  ).join('');
}

function quickFill(q){
  document.getElementById('input').value=q;
  doTranslate();
}

// ==================== TOAST ====================
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded',()=>{
  initDictUI();
  updateLearn();
  initScenarios();
  renderHist();
  initQuick();
});
</script>
